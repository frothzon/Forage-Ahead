<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forage Ahead — 2D Fantasy Action RPG</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1624;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #f6eedc;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .hud-interactive {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
